name: Weave behaviours into UK Deep Dives

on:
  push:
    paths:
      - '.github/workflows/weave-behaviours-uk-deep-dives.yml'

permissions:
  contents: write

jobs:
  update-deep-dives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Weave behaviour language into existing responsibilities
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('english/AM.html'), Path('english/GM.html'), Path('english/headchef.html'),
              Path('english/kpprepchef.html'), Path('english/pizzachef.html'), Path('english/secondchef.html'),
              Path('english/seniorchef.html'), Path('english/supervisor.html'), Path('english/waiter.html')
          ]

          behaviours = [
              ('Taking ownership', ['ownership', 'accountability', 'responsibility', 'responsible', 'standards', 'checks'],
               ' Demonstrates Taking ownership by following responsibilities and actions through from start to finish.'),
              ('Thriving under pressure', ['under pressure', 'busy services', 'busy service', 'busy periods', 'busy', 'peak', 'service'],
               ' Shows Thriving under pressure by staying calm, organised and focused on a great guest experience.'),
              ('Good communicator', ['communication', 'communicates', 'communicate', 'pre-shift', 'team'],
               ' Acts as a Good communicator, adapting their approach clearly and positively to the people around them.'),
              ('Cares for people', ['coaches', 'coaching', 'development', 'develop', 'supports', 'support', 'team member', 'teammates', 'team'],
               ' Demonstrates our Cares for people behaviour by supporting, coaching and helping others to succeed.'),
              ('Pride & Passion', ['food audit', 'food quality', 'pizza quality', 'product', 'menu', 'pizza', 'quality', 'dough'],
               ' Showcases Pride & Passion for our products by protecting quality and sharing what makes them special.'),
              ('Curiosity and drive', ['commercial', 'business', 'sales', 'profit', 'kpi', 'targets', 'waste', 'stock', 'cost', 'opportunities'],
               ' Shows Curiosity and drive by looking for ways to positively impact the commercial success of the business.'),
          ]

          string_re = re.compile(r'"((?:[^"\\]|\\.)*)"')
          behaviour_labels = [label.lower() for label, _, _ in behaviours]
          additions = [addition for _, _, addition in behaviours]

          for path in files:
              text = path.read_text(encoding='utf-8')

              for addition in additions:
                  text = text.replace(addition, '')

              start = text.find('const data =')
              if start == -1:
                  raise RuntimeError(f'Could not find Deep Dive data block in {path}')

              function_start = text.find('\nfunction ', start)
              if function_start == -1:
                  raise RuntimeError(f'Could not find first function after data block in {path}')
              end = text.rfind('};', start, function_start)
              if end == -1:
                  raise RuntimeError(f'Could not find end of Deep Dive data block in {path}')
              end += 2

              before = text[:start]
              data = text[start:end]
              after = text[end:]

              for label, keywords, addition in behaviours:
                  chosen = None
                  matches = list(string_re.finditer(data))
                  for keyword in keywords:
                      for m in matches:
                          value = m.group(1)
                          low = value.lower()
                          if any(existing in low for existing in behaviour_labels):
                              continue
                          if keyword.lower() in low and len(value) > 35:
                              chosen = m
                              break
                      if chosen:
                          break

                  if not chosen:
                      raise RuntimeError(f'No suitable responsibility found for {label} in {path}')

                  value = chosen.group(1).rstrip()
                  if value.endswith('.'):
                      value = value[:-1]
                  replacement = '"' + value + '.' + addition.replace('"','\\"') + '"'
                  data = data[:chosen.start()] + replacement + data[chosen.end():]

              rebuilt = before + data + after

              for label, _, _ in behaviours:
                  if data.lower().count(label.lower()) != 1:
                      raise RuntimeError(f'Expected exactly one {label} mention in Deep Dive content for {path}')
                  if label.lower() in before.lower() or label.lower() in after.lower():
                      raise RuntimeError(f'{label} appeared outside Deep Dive content in {path}')

              path.write_text(rebuilt, encoding='utf-8')

      - name: Commit UK Deep Dive behaviour updates
        run: |
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english/*.html
          git commit -m "Refine behaviour language in UK Deep Dives"
          git push origin main
