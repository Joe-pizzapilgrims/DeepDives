name: Polish lower-role behaviour wording

on:
  push:
    paths:
      - '.github/workflows/weave-behaviours-uk-deep-dives.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Move pressure behaviour to relevant responsibilities
        shell: python
        run: |
          from pathlib import Path

          pressure = ' Shows Thriving under pressure by staying calm, organised and focused on a great guest experience.'

          fixes = {
              Path('english/pizzachef.html'): (
                  '"Can speak and understand written English.' + pressure + '",',
                  '"Can speak and understand written English.",',
                  '"Can serve tables if necessary, giving great PP hospitality to guests."',
                  '"Can serve tables if necessary, giving great PP hospitality to guests.' + pressure + '"'
              ),
              Path('english/waiter.html'): (
                  '"Can speak and understand written English.' + pressure + '",',
                  '"Can speak and understand written English.",',
                  '"Can demonstrate handling guest complaints or questions in a mature and reasonable manner, resolving the issue whilst ensuring the manager is informed."',
                  '"Can demonstrate handling guest complaints or questions in a mature and reasonable manner, resolving the issue whilst ensuring the manager is informed.' + pressure + '"'
              )
          }

          for path, (bad, clean, target, replacement) in fixes.items():
              text = path.read_text(encoding='utf-8')
              if bad not in text:
                  raise RuntimeError(f'Expected pressure wording not found in {path}')
              text = text.replace(bad, clean, 1)
              if target not in text:
                  raise RuntimeError(f'Target responsibility not found in {path}')
              text = text.replace(target, replacement, 1)
              if text.count('Thriving under pressure') != 1:
                  raise RuntimeError(f'Expected one pressure behaviour mention in {path}')
              path.write_text(text, encoding='utf-8')

      - name: Commit wording polish
        run: |
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english/pizzachef.html english/waiter.html
          git commit -m "Polish behaviour wording in lower-role Deep Dives"
          git push origin main
